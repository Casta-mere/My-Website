<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" class="gr">
  <style>
    /*
      Theme-aware colors via light-dark().
      Imported as a React component (SVGR) this SVG is inlined in the page and
      inherits color-scheme from Docusaurus' html[data-theme], so it follows the
      site's light/dark toggle. Opened standalone it renders the light palette.
      Every color is declared twice: the plain value first is a fallback for
      browsers without light-dark() support.
    */
    .gr { font-family: var(--ifm-font-family-base, system-ui, -apple-system, "Segoe UI", sans-serif); }
    .gr-h   { font-size: 14px; font-weight: 500; fill: #141413; fill: light-dark(#141413, #e3e3e3); }
    .gr-sub { font-size: 12px; fill: #3d3d3a; fill: light-dark(#3d3d3a, #b4b4b0); }
    .gr-c   { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
    .gr-main rect { fill: #e6f1fb; fill: light-dark(#e6f1fb, #1a2d45); stroke: #185fa5; stroke: light-dark(#185fa5, #4d94e6); stroke-width: 0.5; }
    .gr-main text { fill: #0c447c; fill: light-dark(#0c447c, #bfdcf8); }
    .gr-feat rect { fill: #faece7; fill: light-dark(#faece7, #3f2218); stroke: #993c1d; stroke: light-dark(#993c1d, #e0673a); stroke-width: 0.5; }
    .gr-feat text { fill: #712b13; fill: light-dark(#712b13, #f8cdb7); }
    .gr-ln-n { fill: none; stroke: #73726c; stroke: light-dark(#73726c, #8f8e88); stroke-width: 1.5; }
    .gr-ln-f { fill: none; stroke: #d85a30; stroke: light-dark(#d85a30, #e0673a); stroke-width: 1.5; }
    .gr-div  { stroke: rgba(31, 30, 29, 0.3); stroke: light-dark(rgba(31, 30, 29, 0.3), rgba(255, 255, 255, 0.22)); stroke-width: 0.5; stroke-dasharray: 4 4; }
  </style>
  <defs>
    <marker id="gr-arrow-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="gr-ln-n" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gr-arrow-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="gr-ln-f" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- BEFORE -->
  <text class="gr-h" x="40" y="36">Before rebase</text>
  <text class="gr-sub" x="40" y="56">Two branches diverged from a common ancestor</text>

  <!-- main branch commits -->
  <g class="gr-main">
    <rect x="60" y="90" width="80" height="40" rx="8"/>
    <text class="gr-c" x="100" y="112">C1</text>
    <rect x="180" y="90" width="80" height="40" rx="8"/>
    <text class="gr-c" x="220" y="112">C2</text>
    <rect x="300" y="90" width="80" height="40" rx="8"/>
    <text class="gr-c" x="340" y="112">C3</text>
    <rect x="420" y="90" width="80" height="40" rx="8"/>
    <text class="gr-c" x="460" y="112">C4</text>
  </g>
  <line class="gr-ln-n" x1="140" y1="110" x2="178" y2="110" marker-end="url(#gr-arrow-n)"/>
  <line class="gr-ln-n" x1="260" y1="110" x2="298" y2="110" marker-end="url(#gr-arrow-n)"/>
  <line class="gr-ln-n" x1="380" y1="110" x2="418" y2="110" marker-end="url(#gr-arrow-n)"/>
  <text class="gr-sub" x="510" y="104">main</text>

  <!-- feature branch commits (diverged from C2) -->
  <g class="gr-feat">
    <rect x="300" y="170" width="80" height="40" rx="8"/>
    <text class="gr-c" x="340" y="192">F1</text>
    <rect x="420" y="170" width="80" height="40" rx="8"/>
    <text class="gr-c" x="460" y="192">F2</text>
  </g>
  <line class="gr-ln-f" x1="260" y1="120" x2="298" y2="178" marker-end="url(#gr-arrow-f)"/>
  <line class="gr-ln-f" x1="380" y1="190" x2="418" y2="190" marker-end="url(#gr-arrow-f)"/>
  <text class="gr-sub" x="510" y="184">feature</text>

  <!-- divider -->
  <line class="gr-div" x1="40" y1="260" x2="640" y2="260"/>

  <!-- AFTER -->
  <text class="gr-h" x="40" y="296">After git rebase main</text>
  <text class="gr-sub" x="40" y="316">Feature commits replayed on top of main — linear history</text>

  <g class="gr-main">
    <rect x="60" y="350" width="70" height="40" rx="8"/>
    <text class="gr-c" x="95" y="372">C1</text>
    <rect x="160" y="350" width="70" height="40" rx="8"/>
    <text class="gr-c" x="195" y="372">C2</text>
    <rect x="260" y="350" width="70" height="40" rx="8"/>
    <text class="gr-c" x="295" y="372">C3</text>
    <rect x="360" y="350" width="70" height="40" rx="8"/>
    <text class="gr-c" x="395" y="372">C4</text>
  </g>
  <!-- rebased feature commits: new SHAs, shown with ' -->
  <g class="gr-feat">
    <rect x="460" y="350" width="70" height="40" rx="8"/>
    <text class="gr-c" x="495" y="372">F1'</text>
    <rect x="560" y="350" width="70" height="40" rx="8"/>
    <text class="gr-c" x="595" y="372">F2'</text>
  </g>
  <line class="gr-ln-n" x1="130" y1="370" x2="158" y2="370" marker-end="url(#gr-arrow-n)"/>
  <line class="gr-ln-n" x1="230" y1="370" x2="258" y2="370" marker-end="url(#gr-arrow-n)"/>
  <line class="gr-ln-n" x1="330" y1="370" x2="358" y2="370" marker-end="url(#gr-arrow-n)"/>
  <line class="gr-ln-f" x1="430" y1="370" x2="458" y2="370" marker-end="url(#gr-arrow-f)"/>
  <line class="gr-ln-f" x1="530" y1="370" x2="558" y2="370" marker-end="url(#gr-arrow-f)"/>
  <text class="gr-sub" x="395" y="410">main</text>
  <text class="gr-sub" x="595" y="410">feature</text>

  <!-- annotation -->
  <text class="gr-sub" x="364" y="450">F1' and F2' are new commits — same changes, new SHAs</text>
  <text class="gr-sub" x="364" y="470">Now main can fast-forward merge cleanly</text>
</svg>
